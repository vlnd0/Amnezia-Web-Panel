version: '3.8'

services:
  amnezia_panel:
    build: .
    image: amnezia-panel:fork-local
    container_name: amnezia_panel

    ports:
      - "${APP_PORT:-5000}:5000"

    volumes:
      - amnezia_data:/app/data

    environment:
      DATA_FILE: /app/data/data.json
      AWG_CONN_MONITOR: "off"
      PRESERVE_SERVER_IDS: "on"
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost', 5000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  amnezia_data:
